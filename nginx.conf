server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Tệp tĩnh có hash trong tên: cache lâu. index.html không cache để cập nhật bản mới ngay.
  location /static/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-store";
  }
  # React Router (chế độ history): mọi đường dẫn không phải tệp đều trả index.html
  location / {
    try_files $uri /index.html;
  }
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
